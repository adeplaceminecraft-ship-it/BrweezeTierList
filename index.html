<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>BreezeTierList</title>

<meta name="google-site-verification" content="I6mJRWAmo_1QPDGOIKcY9bo9wgAEqqCp-wPcnvhAOr0" />

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            BreezeTierList
        </div>

        <div class="nav-links">

            <a href="#leaderboard-section">
                Leaderboard
            </a>

            <a href="#gamemodes-section">
                Gamemodes
            </a>

        </div>

    </nav>



    <!-- MAIN -->

    <main class="container">


        <!-- OVERALL LEADERBOARD -->

        <section id="leaderboard-section">

            <div class="hero">

                <div class="eyebrow">
                    MINECRAFT PVP RANKINGS
                </div>

                <h1>
                    Overall Leaderboard
                </h1>

                <p>
                    Rank your friends across every gamemode.
                </p>

            </div>


            <h2>
                Overall Rankings
            </h2>

            <div id="leaderboard"></div>

        </section>



        <!-- GAMEMODE SELECTOR -->

        <section id="gamemodes-section">

            <h2>
                Gamemodes
            </h2>

            <p class="section-description">
                Select a gamemode to view its rankings.
            </p>

            <div id="gamemode-list"></div>

        </section>



        <!-- INDIVIDUAL GAMEMODE -->

        <section id="gamemode-page">

            <button id="back-button">
                ← Back to Gamemodes
            </button>

            <div id="gamemode-header"></div>

            <div id="gamemode-leaderboard"></div>

        </section>


    </main>


    <script src="script.js"></script>

</body>

</html>
